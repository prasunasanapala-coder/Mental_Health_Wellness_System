{% extends 'base.html' %}
{% block content %}

<h3 class="mb-4">Meditation Sessions 🧘‍♂️</h3>

<div class="row g-4">

  {% for m in meditations %}
  <div class="col-md-4">
    <div class="card shadow-sm p-3 h-100">
      <h5>{{ m.title }}</h5>
      <p class="text-muted">{{ m.description }}</p>
      <p><b>Duration:</b> {{ m.duration }} minutes</p>

      <a href="{% url 'meditation_detail' m.id %}" 
         class="btn btn-primary btn-sm w-100">
        Start Meditation
      </a>
    </div>
  </div>
  {% empty %}
    <p class="text-muted">No meditation sessions available.</p>
  {% endfor %}

</div>

{% endblock %}
