{% extends 'base.html' %}
{% block content %}

<div class="container text-center">

    <!-- Title -->
    <h2 class="mb-3">{{ meditation.title }} 🧘‍♂️</h2>

    <!-- Image -->
    {% if meditation.image %}
        <img src="{{ meditation.image.url }}"
             class="img-fluid rounded shadow mb-3"
             style="max-height:300px;">
    {% endif %}

    <!-- Description -->
    <p class="text-muted">{{ meditation.description }}</p>

    <p><b>Duration:</b> {{ meditation.duration }} minutes</p>

    <!-- TIMER DISPLAY -->
    <div class="mt-4">
        <h4>Session Timer ⏳</h4>
        <h1 id="timer" class="text-success"></h1>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress mt-3" style="height:20px;">
        <div id="progressBar"
             class="progress-bar bg-success"
             role="progressbar"
             style="width:0%">
        </div>
    </div>

    <!-- CONTROL BUTTONS -->
    <div class="mt-4">
        <button class="btn btn-success" onclick="startTimer()">Start</button>
        <button class="btn btn-warning" onclick="pauseTimer()">Pause</button>
        <button class="btn btn-danger" onclick="resetTimer()">Reset</button>
    </div>

    <!-- Finish Button -->
    <div class="mt-4">
        <a href="{% url 'dashboard' %}" class="btn btn-primary">
            Finish Session
        </a>
    </div>

</div>

<script>
let totalTime = {{ meditation.duration }} * 60;  // convert minutes to seconds
let timeLeft = totalTime;
let timerInterval = null;

const timerDisplay = document.getElementById("timer");
const progressBar = document.getElementById("progressBar");

function updateDisplay() {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;

    timerDisplay.textContent = minutes + ":" + seconds;

    let progressPercent = ((totalTime - timeLeft) / totalTime) * 100;
    progressBar.style.width = progressPercent + "%";
}

function startTimer() {
    if (timerInterval) return; // prevent multiple intervals

    timerInterval = setInterval(function () {

        if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
        } else {
            clearInterval(timerInterval);
            timerInterval = null;
            timerDisplay.textContent = "Session Complete 🎉";
            alert("Well Done! Meditation Completed 🌿");
        }

    }, 1000);
}

function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function resetTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    timeLeft = totalTime;
    updateDisplay();
}

// Initialize display
updateDisplay();
</script>

{% endblock %}
