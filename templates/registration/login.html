<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Mental Wellness</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to right, #a8edea, #fed6e3); height:100vh;">

<div class="container h-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg p-4" style="width: 380px; border-radius: 15px;">

        <h3 class="text-center mb-3">🧘 Mental Wellness</h3>
        <p class="text-center text-muted mb-4">
            Login to continue your wellness journey
        </p>

        {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                {{ form.username }}
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-success w-100">
                Login
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">
                New user? <a href="/signup/">Create an account</a>
            </small>
        </div>

    </div>
</div>

</body>
</html>
